services:
  web:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-preview.local}
      - HOST=0.0.0.0
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    restart: unless-stopped

volumes:
  node_modules:
